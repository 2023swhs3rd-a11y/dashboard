name: Collect repo stats

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC). 덜 자주 돌리려면 "17 */6 * * *" 등으로 바꾸세요.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        run: node scripts/collect.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: update repo stats"
            git push
          fi
